name: Accessibility Tests

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run accessibility tests
        run: npm run test:a11y --if-present || echo "No a11y test script defined yet"

      - name: Lighthouse CI (Accessibility)
        # Optional: Add @lhci/cli later for full Lighthouse a11y scoring
        run: echo "Lighthouse CI can be added here for full a11y scoring"
